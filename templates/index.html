<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ bot_name }}</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #0f172a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .chat-container {
        width: 100%;
        max-width: 480px;
        height: 640px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .chat-header {
        background: #b91c1c;
        color: #ffffff;
        padding: 18px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .chat-header .badge {
        background: #ffffff;
        color: #b91c1c;
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 999px;
        letter-spacing: 0.5px;
    }

    .chat-header h1 {
        font-size: 17px;
        margin: 0;
    }

    .chat-messages {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #f8fafc;
    }

    .message {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 14px;
        line-height: 1.4;
        font-size: 14px;
        white-space: pre-wrap;
        word-wrap: break-word;
    }

    .message.bot {
        background: #e2e8f0;
        color: #0f172a;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }

    .message.user {
        background: #b91c1c;
        color: #ffffff;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }

    .message.typing {
        font-style: italic;
        color: #64748b;
    }

    .chat-input {
        display: flex;
        border-top: 1px solid #e2e8f0;
        padding: 12px;
        gap: 8px;
        background: #ffffff;
    }

    .chat-input input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 14px;
        outline: none;
    }

    .chat-input input:focus {
        border-color: #b91c1c;
    }

    .chat-input button {
        background: #b91c1c;
        color: #ffffff;
        border: none;
        padding: 0 18px;
        border-radius: 10px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 600;
    }

    .chat-input button:hover {
        background: #991b1b;
    }

    .chat-input button:disabled {
        background: #f1a3a3;
        cursor: not-allowed;
    }
</style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h1>{{ bot_name }}</h1>
        <span class="badge">BREAKING NEWS ONLY</span>
    </div>

    <div class="chat-messages" id="chat-messages">
        <div class="message bot">
            Hi! I'm {{ bot_name }}. Ask me about breaking news or the latest
            updates on any current event.
        </div>
    </div>

    <div class="chat-input">
        <input
            type="text"
            id="user-input"
            placeholder="Ask about the latest news..."
            autocomplete="off"
        >
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById("chat-messages");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function addMessage(text, sender) {
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("message", sender);
        msgDiv.textContent = text;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return msgDiv;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) {
            return;
        }

        addMessage(text, "user");
        userInput.value = "";
        userInput.disabled = true;
        sendBtn.disabled = true;

        const typingMsg = addMessage("Typing...", "bot typing");

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();
            typingMsg.remove();
            addMessage(data.reply || "No response received.", "bot");
        } catch (error) {
            typingMsg.remove();
            addMessage("Network error. Please try again.", "bot");
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>

</body>
</html>
